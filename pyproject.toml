[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docking_platform_gui"
version = "0.1.0"
description = "Reproducible protocol development and virtual screening GUI for molecular docking"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Gerrit Koorsen" }
]
keywords = [
  "molecular docking",
  "virtual screening",
  "cheminformatics",
  "drug discovery",
  "reproducible research"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry"
]

dependencies = [
  "numpy",
  "pandas",
  "openpyxl",
  "rdkit",
  "loguru",
  "biopython",
  "pydantic<2",
  "MDAnalysis",
  "gemmi",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "seaborn"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/gkoorsen/docking_platform_gui"
Repository = "https://github.com/gkoorsen/docking_platform_gui"
Issues = "https://github.com/gkoorsen/docking_platform_gui/issues"
Documentation = "https://github.com/gkoorsen/docking_platform_gui/blob/master/USER_GUIDE.md"

[project.scripts]
redock-gui = "docking_platform_gui.cli:main"

[tool.setuptools.packages.find]
namespaces = false
include = ["docking_platform_gui*"]
exclude = ["docking_platform_gui.tests*"]
