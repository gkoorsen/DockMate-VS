[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docking_platform_gui"
version = "0.1.0"
description = "Redock analysis GUI with adaptive docking pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Gerrit Koorsen" }
]

dependencies = [
  "numpy",
  "pandas",
  "openpyxl",
  "rdkit",
  "loguru",
  "biopython",
  "pydantic<2",
  "MDAnalysis",
  "gemmi"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
redock-gui = "docking_platform_gui.cli:main"

[tool.setuptools.packages.find]
namespaces = false
include = ["docking_platform_gui*"]
exclude = ["docking_platform_gui.tests*"]
