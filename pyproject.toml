[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dockmate-vs"
version = "0.1.0"
description = "Reproducible docking protocol development and structure-based virtual screening"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Gerrit Koorsen" }
]
keywords = [
  "molecular docking",
  "virtual screening",
  "cheminformatics",
  "drug discovery",
  "reproducible research"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry"
]

dependencies = [
  "numpy",
  "pandas",
  "openpyxl",
  "PyYAML",
  "rdkit",
  "loguru",
  "biopython",
  "pydantic<2",
  "MDAnalysis",
  "gemmi",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "seaborn"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/gkoorsen/DockMate-VS"
Repository = "https://github.com/gkoorsen/DockMate-VS"
Issues = "https://github.com/gkoorsen/DockMate-VS/issues"
Documentation = "https://github.com/gkoorsen/DockMate-VS/blob/master/USER_GUIDE.md"

[project.scripts]
dockmate-vs = "dockmate_vs.cli:main"

[tool.setuptools.packages.find]
namespaces = false
include = ["dockmate_vs*"]
exclude = ["dockmate_vs.tests*"]
