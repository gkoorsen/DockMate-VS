name: dockmate-vs
channels:
  - conda-forge
dependencies:
  - python>=3.9,<3.13
  - pip
  - tk
  - numpy
  - pandas
  - openpyxl
  - pyyaml
  # Avoid the malformed conda-forge RDKit 2026.03.5 macOS ARM signature.
  - rdkit<2026
  - loguru
  - biopython
  - pydantic<2
  - mdanalysis
  - gemmi
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - openmm
  - pdbfixer
  - openbabel
