name: Container

on:
  pull_request:
    paths:
      - "docker/**"
      - "dockmate_vs/**"
      - "pyproject.toml"
      - ".github/workflows/container.yml"
  push:
    branches: [master]
    paths:
      - "docker/**"
      - "dockmate_vs/**"
      - "pyproject.toml"
      - ".github/workflows/container.yml"
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: dockmate-vs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check bundled dependencies
        run: docker run --rm dockmate-vs:ci doctor --strict
      - name: Run test suite inside container
        run: >
          docker run --rm --entrypoint /usr/local/bin/_entrypoint.sh
          dockmate-vs:ci /bin/bash -c
          'cd /opt/dockmate-vs && /opt/conda/bin/python -m pytest dockmate_vs/tests -q -p no:cacheprovider'
